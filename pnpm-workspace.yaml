# 依赖平铺安装，确保依赖图谱与 Vite 预构建逻辑完全吻合
nodeLinker: hoisted
# 将依赖全部提升到根 node_modules，防止依赖在 Node 22 下找不到彼此
shamefullyHoist: true
# 自动安装 peerDependencies
autoInstallPeers: true

minimumReleaseAge: 0

packages:
  - 'apps/*'

allowBuilds:
  esbuild: true
  # 不下载 puppeteer 自带的 Chrome：table-width 脚本会优先复用
  # Playwright 缓存，或用 TW_CHROME 指定系统 Chrome
  # （见 .claude/skills/table-width/scripts/lib/browser.mjs）
  puppeteer: false
